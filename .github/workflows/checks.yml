name: Model and notebook checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m ipykernel install --sys-prefix --name python3
      - name: Run every estimation notebook cell
        run: |
          mkdir -p results
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=1200 \
            --output executed-estimation.ipynb --output-dir results \
            parameter_estimation_notebook.ipynb
